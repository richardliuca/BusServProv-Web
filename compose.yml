# Frontend-only stack: Next.js (web) behind nginx.
#   docker compose -f compose.yml --profile web up --build              — production images
#   docker compose -f compose.yml -f compose.dev.yml --profile web up   — hot reload
name: busservprov

services:
  web:
    profiles:
      - web
    build:
      context: .
      dockerfile: app/web/Dockerfile
      target: production
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    environment:
      NODE_ENV: production
    networks:
      - bsp

  nginx:
    profiles:
      - web
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    ports:
      - '80:80'
      - '443:443'
    networks:
      - bsp
    depends_on:
      - web

networks:
  bsp:
    driver: bridge
