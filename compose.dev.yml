# Development override: hot reload for the web app.
# Usage:
#   docker compose -f compose.yml -f compose.dev.yml --profile web up --build

services:
  web:
    build:
      context: .
      dockerfile: app/web/Dockerfile
      target: development
    volumes:
      - ./:/repo
      - /repo/node_modules
      - web_next_cache:/repo/app/web/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'

volumes:
  web_next_cache:
